name: Release

# 打 tag 即出包：v0.1.0 → 版本号取自 tag，产物直接进同名 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（需已存在或由本次创建，形如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 一边失败不影响另一边，产物能留就留
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # universal：一份 dmg 同时覆盖 Intel 与 Apple Silicon
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            triple: universal-apple-darwin
          - platform: windows-latest
            args: ''
            targets: ''
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # 打包前先确认内置运行时真的能在这个平台上跑起来。
      # 这类故障只在目标平台暴露（路径分隔符、平台专属依赖、打包漏文件），
      # mac 上一切正常、Windows 装完就报「pi 进程退出」。
      - name: 内置运行时冒烟
        # OCU 运行时也在打包资源里，同样在这一步准备：缺平台产物或 npm 装不上时
        # 立刻失败，不必等十几分钟编译完才发现打包脚本跑不通
        run: node scripts/prepare-pi-runtime.mjs && node scripts/prepare-ocu-runtime.mjs && node scripts/smoke-runtime.mjs
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.triple }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包的签名私钥：没有它 createUpdaterArtifacts 会直接报错
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名：p12 的 base64 + 密码 + 身份名。
          # 签名不是为了过 Gatekeeper（那需要 Developer ID + 公证），
          # 而是让 TCC 认得「这是同一个 app」——否则每次更新后
          # 「允许访问桌面文件夹」都会重新问一遍。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Piazza ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            桌面版安装包。macOS 为 universal（Intel + Apple Silicon），Windows 为 x64 安装程序。

            - macOS：暂未做公证，首次打开需右键「打开」，或执行
              `xattr -dr com.apple.quarantine /Applications/Piazza.app`
            - Windows：未做代码签名，SmartScreen 会提示「更多信息 → 仍要运行」

            应用内会自动检查更新（设置 → 关于 可关）。
          releaseDraft: false
          prerelease: false
          # 两个 job 各写一份会互相覆盖，统一交给下面的 publish job 生成
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # 等两个平台都传完，再生成唯一的一份 latest.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/build-latest-json.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          # 留空：latest.json 会直接取 Release 正文当作更新说明
